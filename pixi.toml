[workspace]
name = "wreckfest-headtracking"
version = "0.1.0"
description = "Head tracking mod for Wreckfest (Bugbear's in-house engine)"
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "foreach ($d in @('build','build-tests','release')) { if (Test-Path $d) { Remove-Item $d -Recurse -Force } }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Unit tests: the camera transform composition, the gameplay gate, the config
# tests, the frozen HeadTracking.ini reader, the config differential test, which
# holds that reader to v0.1.0's and the migration into CameraUnlock.ini to the
# reader, and core's canonical config lint over every file that test migrated.
# Builds in build-tests/ so the packaged build/ tree never contains a test
# binary. Needs no game install.
test = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1" }
build-tests = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -NoRun" }

# Rewrites HeadTracking.ini, the committed CameraUnlock.ini (the path core's
# data/config-format.json records), from the config table after a change to a
# row, a comment or a default, then writes the launcher manifest's config
# descriptor per_game from it. wf_config_tests fails until it has run.
render-config = { cmd = "build-tests/tests/Debug/wf_config_tests.exe --render-config HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-tests"] }

# Bump vendored Ultimate ASI Loader copy. Manual; commit the result.
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# Depends on test, so no ZIP is built from a tree whose tests or config
# differential test fail.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build", "test"] }

# Dev loop: build, then copy the .asi + vendored loader straight into EVERY
# detected game folder - the Steam and Game Pass copies are different builds
# and both need the new binary. install.cmd is the end-user path and is not run
# here - it pauses when it isn't given /y, and pixi allocates no stdin to read
# from.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

# Loops uninstall.cmd over every detected install for the same reason.
uninstall = "powershell -ExecutionPolicy Bypass -File scripts/uninstall-all.ps1 /y"

# Checks the newest release/*-installer.zip against the launcher manifest rules
# and the canonical config's delivery rules. Run after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

# Compare every installed Wreckfest_x64.exe PE fingerprint against every build
# profile in src/builds/. First thing to run when a user reports the dormant
# "unknown build" log line.
check-fingerprint = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1"

[dependencies]
# The build uses the system CMake and Visual Studio. Packaging runs core's config
# descriptor check (Copy-SharedBundle) with node. Pinned to the release core's
# own lock resolves.
nodejs = "==26.5.0"
